# 用法（在 Workspaces 目录）: docker compose build && docker compose up
# deploy.resources 仅 docker compose v2+ 生效；docker-compose v1 需 runtime: nvidia
services:
  mergekit-beta:
    # Reap Ray grandchildren after a stopped evolution task; Flask itself is not a process reaper.
    init: true
    runtime: nvidia
    shm_size: "10g"
    restart: unless-stopped
    # 可选固定 hostname；单机 Docker 可配合 MERGEKIT_RAY_SINGLE_NODE_LOOPBACK + extra_hosts 使用
    hostname: mergekit-beta-local
    build:
      context: .
      dockerfile: mergeKit_beta/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: mergekit-beta:latest
    ports:
      - "5000:5000"
    healthcheck:
      # 说明：镜像内未必有 curl；用 python 标准库访问 /healthz
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5).read()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - PORT=5000
      # 默认 all。若某张卡 PCIe 异常（nvidia-smi 报 Unable to determine device handle / sysfs link Unknown），
      # 在仓库旁 .env 设置 NVIDIA_VISIBLE_DEVICES 为若干 GPU-UUID（逗号分隔），用宿主机 nvidia-smi -L 取健康卡的 UUID，避免 CDI 枚举死卡导致容器无法启动。
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      # Comma-separated immutable UUIDs of physical GPUs reserved from publication validation.
      # Validation fails closed when this is empty; configure it in the ignored host .env.
      - MERGEKIT_PROTECTED_GPU_UUIDS=${MERGEKIT_PROTECTED_GPU_UUIDS:-}
      - LOCAL_MODELS_PATH=/data/Models
      - MERGEKIT_MODEL_POOL=/data/models_pool
      - MERGEKIT_PUBLISHED_MODELS_PATH=/data/PublishedModels
      - DATABASE_URL=${DATABASE_URL:-}
      # Empty keeps legacy SQLite compatibility. The research profile sets this
      # to the dedicated PostgreSQL service before any production cutover.
      - MERGEKIT_MODEL_GATEWAY_DATABASE_URL=${MERGEKIT_MODEL_GATEWAY_DATABASE_URL:-}
      # Redis carries research delivery only; PostgreSQL remains the durable
      # source of truth for job state, cancellation and restart recovery.
      - MERGEKIT_MODEL_GATEWAY_QUEUE_BACKEND=${MERGEKIT_MODEL_GATEWAY_QUEUE_BACKEND:-db}
      - MERGEKIT_MODEL_GATEWAY_REDIS_URL=${MERGEKIT_MODEL_GATEWAY_REDIS_URL:-}
      - MERGEKIT_MODEL_GATEWAY_WORKER_TOKEN=${MERGEKIT_MODEL_GATEWAY_WORKER_TOKEN:-}
      - MERGEKIT_MODEL_GATEWAY_CLAMAV_HOST=${MERGEKIT_MODEL_GATEWAY_CLAMAV_HOST:-model-gateway-clamav}
      - MERGEKIT_MODEL_GATEWAY_CLAMAV_PORT=${MERGEKIT_MODEL_GATEWAY_CLAMAV_PORT:-3310}
      # Invited-user safeguards: per-Key request, research, concurrency and
      # daily import limits. Defaults live in config.py; .env may lower them.
      - MERGEKIT_MODEL_GATEWAY_CHAT_REQUESTS_PER_MINUTE=${MERGEKIT_MODEL_GATEWAY_CHAT_REQUESTS_PER_MINUTE:-20}
      - MERGEKIT_MODEL_GATEWAY_RESEARCH_SUBMISSIONS_PER_HOUR=${MERGEKIT_MODEL_GATEWAY_RESEARCH_SUBMISSIONS_PER_HOUR:-4}
      - MERGEKIT_MODEL_GATEWAY_MAX_ACTIVE_RESEARCH_JOBS=${MERGEKIT_MODEL_GATEWAY_MAX_ACTIVE_RESEARCH_JOBS:-1}
      - MERGEKIT_MODEL_GATEWAY_IMPORT_BYTES_PER_DAY=${MERGEKIT_MODEL_GATEWAY_IMPORT_BYTES_PER_DAY:-524288000}
      # Source privacy retention; production default is 24 hours. Fractional
      # values are permitted only for a controlled acceptance exercise.
      - MERGEKIT_MODEL_GATEWAY_SOURCE_TTL_HOURS=${MERGEKIT_MODEL_GATEWAY_SOURCE_TTL_HOURS:-24}
      - MERGEKIT_MODEL_GATEWAY_CLEANUP_INTERVAL_SECONDS=${MERGEKIT_MODEL_GATEWAY_CLEANUP_INTERVAL_SECONDS:-60}
      - VLM_SEARCH_DIR=${VLM_SEARCH_DIR:-}
      # 模型服务管理员 API Token；请在 .env 或启动环境注入，仓库不提供默认可用秘钥
      - MERGEKIT_MODEL_GATEWAY_ADMIN_TOKEN=${MERGEKIT_MODEL_GATEWAY_ADMIN_TOKEN:-}
      # NVLink 对内 TP=2（评测推理阶段）：auto=自动选择空闲卡对(01/23)，不足则降级单卡
      - MERGEKIT_EVAL_TOPOLOGY=auto
      - MERGEKIT_EVAL_PAIR_TIMEOUT_S=30
      - MERGEKIT_EVAL_MIN_FREE_GB=12
      # 进化融合 runner 全局墙钟上限（秒），默认 5 天；本地/CI 可用 .env 覆盖 MERGEKIT_MAX_TASK_DURATION_S
      - MERGEKIT_MAX_TASK_DURATION_S=${MERGEKIT_MAX_TASK_DURATION_S:-432000}
      # Triton/torch.compile 运行期需要 C 编译器时，显式指定
      - CC=gcc
      # 降低大块 CUDA 分配碎片化导致的 OOM 概率（PyTorch 2.x）
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_DISABLE_XET=1
      # 安全：不要在版本库中提供 HF_TOKEN 默认值；需要访问私有仓库/限流较紧时请在宿主机环境或 .env 注入
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_DATASETS_CACHE=/data/hf_datasets
      - MERGEKIT_EVAL_HF_CACHE=/data/eval_datasets
      # 数据集离线优先：强制只使用本地 HF_DATASETS_CACHE，缺失则报错（不再向 Hub 拉取，避免卡在下载/锁）
      - MERGEKIT_DATASETS_LOCAL_ONLY=1
      - HF_DATASETS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      # --- vLLM TP=2 + Ray（故障时可选，默认不设置 = 多 worker 并行）---
      # --- 进化融合 TP 策略（默认 auto）---
      # MERGEKIT_EVOLUTION_TP2=auto|1|0
      # - auto（默认）：基于显存余量选择 TP=1（优先并行）；显存不足则尝试 TP=2；仍不足则降低 batch（不隐式改 max_new_tokens/max_samples）
      # - 1：强制 TP=2（仅在模型单卡放不下或明确需要时使用；7B 通常不需要）
      # - 0：强制 TP=1
      # - MERGEKIT_EVOLUTION_TP2=auto
      # 多 worker 并行 vLLM 仍 TCPStore 超时时开启：强制单 Ray worker、串行 eval（仍可用 TP=2）
      # - MERGEKIT_VLLM_TP_SERIALIZE=1
      # c10d 绑定地址（一般无需改；代码默认 127.0.0.1）
      # - MERGEKIT_VLLM_MASTER_ADDR=127.0.0.1
      # 多机 Ray：设为本机可达 IP；单机 Docker 可选：MERGEKIT_RAY_SINGLE_NODE_LOOPBACK=1（ray.init 用 127.0.0.1）
      # - MERGEKIT_RAY_NODE_IP_ADDRESS=192.168.x.x
      # - MERGEKIT_RAY_SINGLE_NODE_LOOPBACK=1
      # TP>1 vLLM 每轮评测默认子进程隔离；回滚进程内 vLLM：MERGEKIT_VLLM_TP_SUBPROCESS=0
      # - MERGEKIT_VLLM_TP_SUBPROCESS=0
      # - MERGEKIT_VLLM_SUBPROCESS_TIMEOUT_S=1200
      # Ray Pool worker 注入 GLOO_SOCKET_IFNAME=lo（可选，与 vLLM 子进程方案并行）
      # - MERGEKIT_RAY_POOL_RUNTIME_ENV=1
      # 进化子进程 NCCL 走 socket（与评测路径类似，默认关）
      # - MERGEKIT_EVOLUTION_NCCL_SHM_DISABLE=1
      # 仅当 IB 异常时考虑：# - MERGEKIT_EVOLUTION_NCCL_IB_DISABLE=1
      # /etc/hosts 去 172：显式 1，或与 MERGEKIT_RAY_SINGLE_NODE_LOOPBACK=1 联动（勿设 MERGEKIT_DOCKER_HOSTS_LOOPBACK_FIX=0）
      # - MERGEKIT_DOCKER_HOSTS_LOOPBACK_FIX=1
    volumes:
      - ./mergeKit_beta:/app/ServiceEndFiles/Workspaces/mergeKit_beta
      - ${HOST_MODELS:-../Models}:/data/Models:ro
      - ${HOST_MODEL_POOL:-../mergeKit/models_pool}:/data/models_pool
      - ${HOST_PUBLISHED_MODELS:-/home/a/Model_factory_data/published_models}:/data/PublishedModels
      - ${HOST_PACKAGES:-../Packages}:/app/ServiceEndFiles/Packages:ro
      - ${HOST_MERGES:-./mergeKit_beta/merges}:/app/ServiceEndFiles/Workspaces/mergeKit_beta/merges
      - ${HOST_HF_DATASETS:-./hf_datasets_cache}:/data/hf_datasets
      - ${HOST_EVAL_DATASETS:-./eval_datasets_cache}:/data/eval_datasets
    dns:
      - 223.5.5.5
      - 8.8.8.8
    extra_hosts:
      - "mergekit-beta-local:127.0.0.1"
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            # 某物理 GPU PCIe 异常时，count:all 会触发 CDI 枚举死卡；改为显式 UUID（与 .env MERGEKIT_NVIDIA_DEVICE_ID_* 一致）。
            # 仅三卡可用时：从下列 device_ids 删掉一行，并同步从 .env 去掉对应 MERGEKIT_* 与 NVIDIA_VISIBLE_DEVICES 中该项。
            - driver: nvidia
              device_ids:
                - ${MERGEKIT_NVIDIA_DEVICE_ID_0}
                - ${MERGEKIT_NVIDIA_DEVICE_ID_1}
                - ${MERGEKIT_NVIDIA_DEVICE_ID_2}
                - ${MERGEKIT_NVIDIA_DEVICE_ID_3}
              capabilities: [gpu]

  model-gateway-postgres:
    profiles: ["research"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MERGEKIT_GATEWAY_POSTGRES_DB:-model_gateway}
      POSTGRES_USER: ${MERGEKIT_GATEWAY_POSTGRES_USER:-model_gateway}
      # Required before `--profile research up`; left empty so normal compose
      # validation and the existing SQLite service remain usable.
      POSTGRES_PASSWORD: ${MERGEKIT_GATEWAY_POSTGRES_PASSWORD:-}
    volumes:
      - ./mergeKit_beta/runtime/model_gateway/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  model-gateway-redis:
    profiles: ["research"]
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./mergeKit_beta/runtime/model_gateway/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  model-gateway-clamav:
    profiles: ["research"]
    # Locally verified against Docker Hub's official linux/amd64 config digest.
    image: clamav/clamav:1.5.3-verified
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./mergeKit_beta/runtime/model_gateway/clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

  model-gateway-research-worker:
    profiles: ["research"]
    image: mergekit-beta:latest
    restart: unless-stopped
    init: true
    command: ["/opt/conda/envs/mergenetic/bin/python", "-m", "app.model_gateway.file_worker"]
    depends_on:
      model-gateway-postgres:
        condition: service_healthy
      model-gateway-redis:
        condition: service_healthy
      model-gateway-clamav:
        condition: service_healthy
      model-gateway-legacy-parser:
        condition: service_healthy
    environment:
      - MERGEKIT_CLI_SCRIPT=1
      - LD_PRELOAD=/opt/conda/envs/mergenetic/lib/libstdc++.so.6
      - DATABASE_URL=${DATABASE_URL:-}
      - MERGEKIT_MODEL_GATEWAY_DATABASE_URL=${MERGEKIT_MODEL_GATEWAY_DATABASE_URL:-}
      - MERGEKIT_MODEL_GATEWAY_QUEUE_BACKEND=${MERGEKIT_MODEL_GATEWAY_QUEUE_BACKEND:-db}
      - MERGEKIT_MODEL_GATEWAY_REDIS_URL=${MERGEKIT_MODEL_GATEWAY_REDIS_URL:-}
      - MERGEKIT_MODEL_GATEWAY_WORKER_TOKEN=${MERGEKIT_MODEL_GATEWAY_WORKER_TOKEN:-}
      - MERGEKIT_MODEL_GATEWAY_CLAMAV_HOST=${MERGEKIT_MODEL_GATEWAY_CLAMAV_HOST:-model-gateway-clamav}
      - MERGEKIT_MODEL_GATEWAY_CLAMAV_PORT=${MERGEKIT_MODEL_GATEWAY_CLAMAV_PORT:-3310}
      - MERGEKIT_MODEL_GATEWAY_FILE_RECONCILE_SECONDS=${MERGEKIT_MODEL_GATEWAY_FILE_RECONCILE_SECONDS:-30}
      # The Worker enforces fetched web-source bytes and owns TTL cleanup.
      - MERGEKIT_MODEL_GATEWAY_IMPORT_BYTES_PER_DAY=${MERGEKIT_MODEL_GATEWAY_IMPORT_BYTES_PER_DAY:-524288000}
      - MERGEKIT_MODEL_GATEWAY_CLEANUP_INTERVAL_SECONDS=${MERGEKIT_MODEL_GATEWAY_CLEANUP_INTERVAL_SECONDS:-60}
      - MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_URL=http://model-gateway-legacy-parser:8090
      - MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_TOKEN=${MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_TOKEN:-}
      - MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_TIMEOUT_SECONDS=${MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_TIMEOUT_SECONDS:-45}
      - MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_MAX_MIB=${MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_MAX_MIB:-50}
    volumes:
      - ./mergeKit_beta:/app/ServiceEndFiles/Workspaces/mergeKit_beta
    networks:
      - default
      - model-gateway-private

  model-gateway-legacy-parser:
    profiles: ["research"]
    build:
      context: .
      dockerfile: mergeKit_beta/model_gateway_legacy_parser/Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: mergekit-legacy-office-parser:latest
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    tmpfs:
      - /work:rw,nosuid,nodev,noexec,size=768m,mode=1777
    environment:
      - HOME=/work/home
      - TMPDIR=/work/tmp
      - MERGEKIT_LEGACY_PARSER_TOKEN=${MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_TOKEN:-}
      - MERGEKIT_LEGACY_PARSER_TIMEOUT_SECONDS=${MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_TIMEOUT_SECONDS:-45}
      - MERGEKIT_LEGACY_PARSER_MAX_MIB=${MERGEKIT_MODEL_GATEWAY_LEGACY_PARSER_MAX_MIB:-50}
    networks:
      - model-gateway-private
    healthcheck:
      test: ["CMD", "java", "-jar", "/opt/legacy-parser/legacy-office-parser.jar", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  model-gateway-private:
    internal: true
